# XcodeGen spec — the Xcode project is generated from this file in CI, so no
# fragile .xcodeproj is committed. Regenerate locally with:  xcodegen generate
#
# RENAME THE APP (one place drives everything):
#   1. Change `name:` below to your app name (used for the scheme, .xcodeproj,
#      product, and IPA file — the CI workflows read it automatically).
#   2. Update PRODUCT_BUNDLE_IDENTIFIER + INFOPLIST_KEY_CFBundleDisplayName.
#   3. Rename the test target (e.g. BridgePhoneTests) and its bundle id to match.
#   4. Optionally rename Sources/App/BridgePhoneApp.swift's `struct BridgePhoneApp`.
name: BridgePhone

options:
  bundleIdPrefix: ru.atmosproduction
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Unsigned build — signing is done on-device by the sideloading tool.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  BridgePhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.atmosproduction.bridgephone
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Штаб"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Для прямого управления ноутбуком через Bluetooth рядом, без интернета."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

  BridgePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BridgePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.atmosproduction.bridgephone.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BridgePhone:
    build:
      targets:
        BridgePhone: all
        BridgePhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BridgePhoneTests
    archive:
      config: Release
